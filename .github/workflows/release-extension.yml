name: Release VSIX

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-extension
  cancel-in-progress: false

jobs:
  check-version:
    name: Check for a new version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      release: ${{ steps.tag_check.outputs.release }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read extension version
        id: version
        run: >
          node -e "const fs = require('node:fs');
          const version = require('./packages/vsc-extension/package.json').version;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'value=' + version + '\n');"

      - name: Check whether the version tag already exists
        id: tag_check
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if git rev-parse "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "v${VERSION} is already released; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  # Runs only for a new version, so pnpm and the Node cache are never set up without an install
  # (setup-node's post step fails when the pnpm store it should cache does not exist).
  release:
    name: Package and publish VSIX
    needs: check-version
    if: needs.check-version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Uses the pnpm version from packageManager in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm test

      - name: Package VSIX
        run: pnpm --filter agms2-vsc-extension package:vsix

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${VERSION}"
          "packages/vsc-extension/agms2-vsc-extension-${VERSION}.vsix"
          --repo "${GITHUB_REPOSITORY}"
          --target "${GITHUB_SHA}"
          --title "v${VERSION}"
          --generate-notes
